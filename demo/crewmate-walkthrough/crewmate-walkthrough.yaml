app:
  url: http://localhost:3000
  viewport:
    width: 1440
    height: 900
  scale: 2
  zoom: 1.0
  colorScheme: dark

titleCard:
  title: "Crewmate — Your AI Co-Founder"
  subtitle: "Autonomous business operations, powered by AI"
  duration: 3500

segments:
  - id: landing
    narration: "Welcome to Crewmate — the AI-powered platform that gives every founder an autonomous digital team."
    intent: "show the landing page"
    actions:
      - type: wait
        duration: 3000

  - id: sign-in
    narration: "Sign in with your Google account to get started."
    intent: "click the sign in button"
    actions: []

  - id: dashboard
    narration: "Once logged in, you arrive at your dashboard where your AI teammates are ready to work."
    intent: "show the main dashboard after login"
    actions:
      - type: wait
        duration: 2500

  - id: teammate
    narration: "Each teammate has a name, a role, and a level — the higher the level, the more they can do autonomously."
    intent: "show a teammate card on the dashboard"
    actions:
      - type: wait
        duration: 2500

  - id: give-objective
    narration: "Let's give our teammate an objective. We'll ask it to create a presentation deck for our investor pitch."
    intent: "type an objective into the input field"
    actions: []

  - id: approval
    narration: "The agent plans the task, generates a full slide outline, and sends it to the Approvals tab for your review."
    intent: "show the approvals tab with the pending quest"
    actions: []

  - id: approve
    narration: "You review the AI-generated content, and with one click — approve. The agent executes it for real in Google Slides."
    intent: "click the approve button"
    actions: []

  - id: mission-complete
    narration: "The mission completes instantly. Your teammate earns XP and levels up — unlocking even more autonomous capabilities."
    intent: "show the completed mission card"
    actions:
      - type: wait
        duration: 3000

  - id: outro
    narration: "Crewmate. Your business, on autopilot."
    intent: "show the dashboard again as the outro"
    actions:
      - type: wait
        duration: 3000
